[package]
name = "x30-live-view"
version = "0.1.0"
description = "Live cameras of the Deep Robotics Jueying X30 (desktop app)"
authors = ["B401 ITS"]
license = "Apache-2.0"
repository = "https://github.com/DarmawanWeb/SimpleRobotDashboard"
edition = "2024"
rust-version = "1.90"

[lib]
# The `_lib` suffix keeps the lib apart from the bin on Windows
# (https://github.com/rust-lang/cargo/issues/8519).
name = "x30_live_view_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5" }
tauri-plugin-log = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
